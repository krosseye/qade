name: Tests

on:
  push:
    branches:
      # main is tested by release.yml, which calls this workflow before releasing.
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Re-check after a PySide6 upgrade if an import fails with a missing .so.
      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxext6 libxrandr2 libxkbcommon0 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 \
            libpulse0 libspeechd2 libdrm2 libbrotli1 libbz2-1.0 \
            libgssapi-krb5-2 libzstd1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
