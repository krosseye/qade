[project]
name = "qade"
version = "0.1.0"
description = "Retro vector arcade game engine built on PySide6."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
  { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4.6,<3.0.0",
  "pysdl2>=0.9.17,<1.0.0",
  "pysdl2-dll>=2.32.10,<3.0.0",
  "pyside6>=6.12.0,<7.0.0",
]


[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["qade_engine"]

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "ruff>=0.17.4",
  "prek>=0.5.10",
  "pytest>=9.2.0",
  "python-semantic-release>=10.7.0",
]
docs = ["mkdocstrings[python]>=1.0.8", "zensical>=0.1.1"]


[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = "sdl2.*"
ignore_missing_imports = true

[tool.ruff.format]
exclude = ["docs/getting-started.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
build_command = "uv lock --upgrade-package qade"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"
